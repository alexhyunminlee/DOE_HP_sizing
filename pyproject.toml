[project]
name = "doe-hp-sizing"
version = "0.1.0"
description = "Research CSVs and Quarto notebooks for heat pump sizing."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "quarto-cli==1.10.19",
    "scipy>=1.18.1",
]

[tool.uv]
package = false
# Always use a Python that uv downloads and manages, never the system or
# Homebrew one, so every machine runs the same interpreter.
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 88
# So `ruff format` includes Python cells in .qmd files.
extension = { qmd = "markdown" }

[dependency-groups]
dev = [
    "prek>=0.3.2",
    "ruff>=0.16.10",
]
