repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "Whitespace: remove trailing whitespace (trailing-whitespace)"
        # Exclude .md: dprint's markdown formatter introduces trailing ws when
        # wrapping at lineWidth and has no trim option, causing an unresolvable loop.
        exclude: \.md$
      - id: end-of-file-fixer
        name: "Whitespace: fix missing newline at end of file (end-of-file-fixer)"
      - id: check-added-large-files
        name: "Git: block files over 600KB (check-added-large-files)"
        args: ["--maxkb=600"]
        # Research CSVs in data/ are expected to be large.
        exclude: ^data/
      - id: check-merge-conflict
        name: "Git: detect merge conflict markers (check-merge-conflict)"
      - id: check-case-conflict
        name: "Git: detect filename case conflicts (check-case-conflict)"
      - id: check-toml
        name: TOML syntax checker (check-toml)
      - id: check-json
        name: JSON syntax checker (check-json)
      - id: pretty-format-json
        name: JSON formatter (pretty-format-json)
        args: [--autofix, --no-sort-keys]
      - id: check-yaml
        name: YAML syntax checker (check-yaml)
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        name: YAML formatter (yamlfmt)
  - repo: https://github.com/instrumentl/pre-commit-just
    rev: v0.1
    hooks:
      - id: format-justfile
        name: Justfile formatter (format-justfile)
  - repo: local
    hooks:
      - id: dprint
        name: Markdown formatter (dprint)
        entry: dprint fmt
        language: python
        types: [markdown]
        additional_dependencies: [dprint-py]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        name: Python linter (ruff-check)
        args: [--fix]
      - id: ruff-format
        name: Python formatter (ruff-format)
        # .qmd is identified as "quarto", not "markdown".
        types_or: [python, pyi, jupyter, markdown, quarto]
